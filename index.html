<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>

<style>
/* Layout: one-screen app — top bar (back + progress), a card deck in the middle, action row at the bottom; follow-up questions slide up as a sheet over the deck */
:root{

}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#151824; --surface:#202436; --ink:#EEF0F7; --muted:#9AA3BC; --line:#343A52;
  --accent:#B48CE6; --accent-soft:#33294A; --yes:#3CC48D; --yes-soft:#1C3A30; --no:#F07672; --no-soft:#432526;
  --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#151824; --surface:#202436; --ink:#EEF0F7; --muted:#9AA3BC; --line:#343A52;
  --accent:#B48CE6; --accent-soft:#33294A; --yes:#3CC48D; --yes-soft:#1C3A30; --no:#F07672; --no-soft:#432526;
  --shadow:0 10px 30px rgba(0,0,0,.4); color-scheme:dark}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;direction:rtl;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.app{height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding-inline:16px;padding-block:12px;box-sizing:border-box;gap:12px}
.top{display:flex;align-items:center;gap:12px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;display:flex;align-items:center;gap:6px;font-size:14px;font-weight:500}
.iconbtn:disabled{opacity:.4;cursor:default}
.prog{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.prog-row{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
.bar{height:6px;background:var(--line);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.brand{font-family:var(--f-display);font-size:22px;line-height:1.1;margin:0}
.deck{flex:1;position:relative;min-height:0}
.card{position:absolute;inset:0;background:var(--surface);border-radius:24px;box-shadow:var(--shadow);border:1px solid var(--line);display:flex;flex-direction:column;padding:24px;box-sizing:border-box;touch-action:none;user-select:none;will-change:transform}
.card.under{transform:scale(.95) translateY(14px);opacity:.7;pointer-events:none}
.card.anim{transition:transform .28s ease,opacity .28s}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--accent-soft);color:var(--accent);font-size:13px;font-weight:700;padding:4px 12px;border-radius:999px;letter-spacing:.02em}
.chip.sub{background:transparent;border:1px solid var(--line);color:var(--muted);font-weight:500}
.name{font-family:var(--f-display);font-size:clamp(30px,8vw,40px);line-height:1.15;margin:auto 0;text-wrap:balance;padding-block:16px}
.meta{display:grid;gap:8px;font-size:14px;color:var(--muted)}
.meta b{color:var(--ink);font-weight:500}
.has{background:var(--yes-soft);color:var(--yes);border-radius:12px;padding:8px 12px;font-weight:500}
.note{font-size:13px;line-height:1.5;white-space:pre-line;overflow-wrap:anywhere;max-height:6.5em;overflow:auto}
.note a{color:var(--accent)}
.prev{border-radius:12px;padding:6px 12px;font-size:13px;font-weight:500;justify-self:start}
.prev.buy{background:var(--yes-soft);color:var(--yes)} .prev.skip{background:var(--no-soft);color:var(--no)}
.stamp{position:absolute;top:28px;font-family:var(--f-display);font-size:26px;padding:4px 14px;border:3px solid;border-radius:10px;opacity:0;pointer-events:none}
.stamp.yes{left:24px;color:var(--yes);transform:rotate(-12deg)}
.stamp.no{right:24px;color:var(--no);transform:rotate(12deg)}
.actions{display:flex;justify-content:center;gap:28px;padding-bottom:4px;direction:ltr}
.act{width:72px;height:72px;border-radius:50%;border:2px solid;background:var(--surface);display:grid;place-items:center;box-shadow:var(--shadow)}
.act svg{width:30px;height:30px}
.act.no{border-color:var(--no);color:var(--no)} .act.yes{border-color:var(--yes);color:var(--yes)}
.act:active{transform:scale(.94)}
.hint{text-align:center;font-size:12px;color:var(--muted);margin:0}
/* sheet */
.sheet{position:absolute;inset:0;background:var(--surface);border-radius:24px;border:1px solid var(--line);box-shadow:var(--shadow);padding:24px;box-sizing:border-box;display:flex;flex-direction:column;gap:16px;overflow:auto}
.sheet h2{font-family:var(--f-display);font-weight:400;font-size:28px;margin:0}
.sheet .for{font-size:14px;color:var(--muted);margin:0}
.opts{display:grid;gap:10px}
.opts.qty{grid-template-columns:repeat(4,1fr)}
.opt{border:2px solid var(--line);background:var(--bg);border-radius:14px;padding:14px;font-size:18px;font-weight:500;text-align:center}
.opts:not(.qty) .opt{text-align:right;display:flex;align-items:center;gap:12px}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.opt .n{font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:1.2em}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:12px;padding:12px;font:inherit;font-size:18px}
.primary{border:0;background:var(--accent);color:var(--surface);border-radius:12px;padding:12px 20px;font-weight:700;font-size:16px}
.primary:disabled{opacity:.4}
.sugg{font-size:13px;color:var(--muted)}
/* summary */
.sum{flex:1;overflow:auto;display:flex;flex-direction:column;gap:16px;min-height:0;padding-bottom:16px}
.sum h2{font-family:var(--f-display);font-weight:400;font-size:30px;margin:0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font-family:var(--f-display);font-size:28px;font-weight:400;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted)}
.grp{background:var(--surface);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.grp h3{margin:0;font-size:15px;padding:10px 14px;background:var(--accent-soft);color:var(--accent);display:flex;justify-content:space-between}
.row{display:flex;justify-content:space-between;gap:12px;padding:10px 14px;border-top:1px solid var(--line);width:100%;background:none;border-inline:0;border-bottom:0;text-align:right;font-size:15px}
.row:first-of-type{border-top:0}
.row span:first-child{min-width:0;overflow-wrap:anywhere}
.row .q{color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.btns{display:grid;gap:10px}
.secondary{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:12px 20px;font-weight:500}
.status{font-size:14px;padding:10px 14px;border-radius:12px;background:var(--accent-soft);color:var(--accent);overflow-wrap:anywhere}
.status a{color:inherit;font-weight:700}
.status.err{background:var(--no-soft);color:var(--no)}
details summary{cursor:pointer;color:var(--muted);font-size:14px}
textarea{width:100%;box-sizing:border-box;height:120px;margin-top:8px;font:12px/1.4 ui-monospace,monospace;background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;direction:rtl}
@media (prefers-reduced-motion:reduce){.card.anim,.bar>i{transition:none}}
</style>

</div>

  try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}
  clearTimeout(saveT);
  saveT=setTimeout(()=>{if(db){db.doc("sorting/main").set({answers:S.answers,hist:S.hist,updatedAt:Date.now()}).catch(()=>{})}},700);
}
const cur=()=>S.hist[S.hist.length-1];
function go(scr){S.hist.push(scr);persist();render()}
function back(){if(S.hist.length>1){S.hist.pop();persist();render()}}
function nextFrom(i){go(i+1>=N?{i:N,step:"done"}:{i:i+1,step:"card"})}

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function linkify(s){return esc(s).replace(/(https?:\/\/\S+)/g,'<a href="$1" target="_blank" rel="noopener">קישור למוצר</a>')}

function cardHTML(it,under){
  const a=S.answers[it.id];
  const bits=[];
  if(it.qty)bits.push(`<div>כמות ברשימה: <b>${esc(it.qty)}</b></div>`);
  if(it.status==="יש")bits.push(`<div class="has">כבר יש${it.where?" · "+esc(it.where):""}${it.date?" · עד "+esc(it.date):""}</div>`);
  if(it.note)bits.push(`<div class="note">${linkify(it.note)}</div>`);
  if(a&&!under)bits.push(a.d==="buy"?`<div class="prev buy">בחרת: לרכוש · ${a.q||"?"} · ${esc(a.w==="אחר"?(a.wNote||"אחר"):(a.w||"?"))}</div>`:`<div class="prev skip">בחרת: לא צריך כרגע</div>`);
  return `<div class="card${under?" under":""}" ${under?"aria-hidden=\"true\"":'id="top"'}>
    <div class="chips"><span class="chip">${esc(it.cat)}</span>${it.sub?`<span class="chip sub">${esc(it.sub)}</span>`:""}</div>
    <div class="name">${esc(it.name)}</div>
    <div class="meta">${bits.join("")}</div>
    ${under?"":'<span class="stamp yes" id="sy">לקנות</span><span class="stamp no" id="sn">לא עכשיו</span>'}
  </div>`;
}

function render(){
  const c=cur();
  const done=Object.keys(S.answers).length;
  $("count").textContent=c.step==="done"?`${N}/${N}`:`${Math.min(c.i+1,N)}/${N}`;
  $("barFill").style.width=(Math.min(c.i,N)/N*100)+"%";
  $("backBtn").disabled=S.hist.length<=1;
  const deck=$("deck"),bottom=$("bottom");
  if(c.step==="done"){bottom.hidden=true;renderSummary();return}
  const it=ITEMS[c.i];
  if(c.step==="card"){
    bottom.hidden=false;
    deck.innerHTML=(ITEMS[c.i+1]?cardHTML(ITEMS[c.i+1],true):"")+cardHTML(it,false);
    bindSwipe($("top"),it);
  } else {
    bottom.hidden=true;
    deck.innerHTML=c.step==="qty"?qtyHTML(it):whereHTML(it);
    c.step==="qty"?bindQty(it):bindWhere(it);
  }
}

function decide(it,d){
  if(d==="skip"){S.answers[it.id]={d:"skip"};nextFrom(cur().i)}
  else{const prev=S.answers[it.id];S.answers[it.id]=Object.assign({},prev&&prev.d==="buy"?prev:{},{d:"buy"});go({i:cur().i,step:"qty"})}
}
function fly(it,d){
  const el=$("top");if(!el){decide(it,d);return}
  el.classList.add("anim");
  el.style.transform=`translateX(${d==="buy"?"":"-"}130%) rotate(${d==="buy"?18:-18}deg)`;
  el.style.opacity="0";
  setTimeout(()=>decide(it,d),220);
}
function bindSwipe(el,it){
  let x0=null,dx=0,y0=0;
  const sy=$("sy"),sn=$("sn");
  el.addEventListener("pointerdown",e=>{if(e.target.closest("a"))return;x0=e.clientX;y0=e.clientY;dx=0;el.setPointerCapture(e.pointerId);el.classList.remove("anim")});
  el.addEventListener("pointermove",e=>{if(x0===null)return;dx=e.clientX-x0;const dy=(e.clientY-y0)*.2;
    el.style.transform=`translate(${dx}px,${dy}px) rotate(${dx/18}deg)`;
    sy.style.opacity=Math.max(0,Math.min(1,dx/100));sn.style.opacity=Math.max(0,Math.min(1,-dx/100))});
  const end=()=>{if(x0===null)return;x0=null;
    if(dx>100)fly(it,"buy");else if(dx<-100)fly(it,"skip");
    else{el.classList.add("anim");el.style.transform="";sy.style.opacity=0;sn.style.opacity=0}};
  el.addEventListener("pointerup",end);el.addEventListener("pointercancel",end);
}

function qtyHTML(it){
  const a=S.answers[it.id]||{};const q=a.q;const custom=q&&![1,2,3].includes(q);
  return `<div class="sheet"><p class="for">${esc(it.name)}</p><h2>כמות?</h2>
    <div class="opts qty">${[1,2,3].map(n=>`<button type="button" class="opt${q===n?" sel":""}" data-q="${n}">${n}</button>`).join("")}
    <button type="button" class="opt${custom?" sel":""}" id="qOther">אחר</button></div>
    <div class="field" id="qField" ${custom?"":"hidden"}><input id="qInput" type="number" inputmode="numeric" min="1" placeholder="מספר" value="${custom?q:""}"><button type="button" class="primary" id="qOk">המשך</button></div>
    ${it.qty?`<div class="sugg">ברשימה המקורית: ${esc(it.qty)}</div>`:""}</div>`;
}
function bindQty(it){
  const setQ=n=>{S.answers[it.id].q=n;go({i:cur().i,step:"where"})};
  document.querySelectorAll("[data-q]").forEach(b=>b.onclick=()=>setQ(+b.dataset.q));
  $("qOther").onclick=()=>{$("qField").hidden=false;$("qInput").focus()};
  const ok=()=>{const n=parseInt($("qInput").value,10);if(n>0)setQ(n);else $("qInput").focus()};
  $("qOk").onclick=ok;$("qInput").onkeydown=e=>{if(e.key==="Enter")ok()};
}
function whereHTML(it){
  const a=S.answers[it.id]||{};
  return `<div class="sheet"><p class="for">${esc(it.name)} · כמות ${a.q}</p><h2>איפה רוכשים?</h2>
    <div class="opts">${WHERE.map((w,k)=>`<button type="button" class="opt${a.w===w?" sel":""}" data-w="${esc(w)}"><span class="n">${k+1}</span>${esc(w)}</button>`).join("")}</div>
    <div class="field" id="wField" ${a.w==="אחר"?"":"hidden"}><input id="wInput" type="text" placeholder="איפה?" value="${esc(a.wNote||"")}"><button type="button" class="primary" id="wOk">המשך</button></div></div>`;
}
function bindWhere(it){
  document.querySelectorAll("[data-w]").forEach(b=>b.onclick=()=>{
    const w=b.dataset.w;
    if(w==="אחר"){$("wField").hidden=false;document.querySelectorAll("[data-w]").forEach(x=>x.classList.toggle("sel",x===b));$("wInput").focus();return}
    Object.assign(S.answers[it.id],{w,wNote:""});nextFrom(cur().i);
  });
  const ok=()=>{const t=$("wInput").value.trim();if(!t){$("wInput").focus();return}Object.assign(S.answers[it.id],{w:"אחר",wNote:t});nextFrom(cur().i)};
  $("wOk").onclick=ok;$("wInput").onkeydown=e=>{if(e.key==="Enter")ok()};
}

// ---------- summary ----------
const whereLabel=a=>a.w==="אחר"?("אחר: "+(a.wNote||"")):a.w;
function rows(){
  const H=["החלטה","איפה רוכשים","פירוט (אחר)","כמות","פריט","קטגוריה","תת-קטגוריה","סטטוס בגיליון המקורי","כמות בגיליון המקורי","הערה"];
  const order=w=>{const k=WHERE.indexOf(w);return k<0?9:k};
  const list=ITEMS.map((it,idx)=>({it,idx,a:S.answers[it.id]}))
    .sort((x,y)=>{const bx=x.a&&x.a.d==="buy"?0:1,by=y.a&&y.a.d==="buy"?0:1;if(bx!==by)return bx-by;
      if(!bx){const d=order(x.a.w)-order(y.a.w);if(d)return d}return x.idx-y.idx});
  return [H,...list.map(({it,a})=>[!a?"לא מוין":a.d==="buy"?"לרכוש":"לא צריך כרגע",a&&a.d==="buy"?a.w||"":"",a&&a.w==="אחר"?a.wNote||"":"",a&&a.d==="buy"?String(a.q||""):"",it.name,it.cat,it.sub,it.status,it.qty,it.note])];
}
const toCSV=r=>r.map(row=>row.map(v=>{v=String(v??"");return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(",")).join("\n");
const toTSV=r=>r.map(row=>row.map(v=>String(v??"").replace(/[\t\n]/g," ")).join("\t")).join("\n");

function renderSummary(){
  const buys=ITEMS.filter(it=>S.answers[it.id]&&S.answers[it.id].d==="buy");
  const skips=ITEMS.filter(it=>S.answers[it.id]&&S.answers[it.id].d==="skip");
  const groups={};buys.forEach(it=>{const k=whereLabel(S.answers[it.id]);(groups[k]=groups[k]||[]).push(it)});
  const units=buys.reduce((s,it)=>s+(S.answers[it.id].q||0),0);
  const grpHTML=(title,list,showQ)=>`<div class="grp"><h3><span>${esc(title)}</span><span>${list.length}</span></h3>${list.map(it=>`<button type="button" class="row" data-jump="${ITEMS.indexOf(it)}"><span>${esc(it.name)}</span>${showQ?`<span class="q">× ${S.answers[it.id].q}</span>`:""}</button>`).join("")}</div>`;
  $("deck").innerHTML=`<div class="sum">
    <h2>סיימנו למיין</h2>
    <div class="stats"><div class="stat"><b>${buys.length}</b><span>פריטים לרכוש</span></div><div class="stat"><b>${units}</b><span>יחידות</span></div><div class="stat"><b>${skips.length}</b><span>לא צריך כרגע</span></div></div>
    <div class="btns">
      <button type="button" class="primary" id="mkSheet">יצירת גיליון Google Sheets</button>
      <button type="button" class="secondary" id="dlCsv">הורדת קובץ CSV</button>
      <button type="button" class="secondary" id="cpTsv">העתקה להדבקה בגיליון</button>
    </div>
    <div id="msg" class="status" hidden></div>
    ${Object.entries(groups).map(([k,l])=>grpHTML(k,l,true)).join("")}
    ${skips.length?grpHTML("לא צריך כרגע",skips,false):""}
    <p class="hint">לחיצה על פריט מחזירה אליו לתיקון</p>
    <button type="button" class="secondary" id="restart">התחלה מחדש</button>
    <div id="restartConfirm" hidden class="btns"><div class="status err">כל הבחירות יימחקו. להמשיך?</div><button type="button" class="secondary" id="restartYes">כן, למחוק ולהתחיל מחדש</button></div>
  </div>`;
  document.querySelectorAll("[data-jump]").forEach(b=>b.onclick=()=>go({i:+b.dataset.jump,step:"card"}));
  $("restart").onclick=()=>{$("restartConfirm").hidden=false};
  $("restartYes").onclick=()=>{S={answers:{},hist:[{i:0,step:"card"}]};persist();render()};
  $("mkSheet").onclick=makeSheet;
  $("dlCsv").onclick=downloadCSV;
  $("cpTsv").onclick=copyTSV;
}
function msg(html,err){const m=$("msg");m.hidden=false;m.className="status"+(err?" err":"");m.innerHTML=html}
const stamp=()=>{const d=new Date();return d.getDate()+"."+(d.getMonth()+1)+"."+String(d.getFullYear()).slice(2)};

async function makeSheet(){
  const b=$("mkSheet");b.disabled=true;msg("יוצר גיליון ב-Google Drive…");
  try{
    const mcp=await window.claude?.use?.("mcp");
    if(!mcp)throw new Error("na");
    const drive=await mcp.server("Google Drive");
    const res=await drive.create_file({title:"סיכום מיון ציוד לצ׳וקופופ "+stamp(),textContent:toCSV(rows()),contentMimeType:"text/csv"});
    let p=res&&res.payload!==undefined?res.payload:res;
    if(typeof p==="string"){try{p=JSON.parse(p)}catch(e){}}
    const f=p&&(p.file||p);
    const url=f&&(f.viewUrl||f.webViewLink||(f.id?"https://docs.google.com/spreadsheets/d/"+f.id+"/edit":""));
    msg(url?`הגיליון נוצר. <a href="${esc(url)}" target="_blank" rel="noopener">פתיחת הגיליון</a>`:"הגיליון נוצר בתיקיית Google Drive שלך.");
  }catch(e){
    msg("לא הצלחתי ליצור את הגיליון מכאן (צריך לאשר גישה ל-Google Drive). אפשר להוריד CSV או להעתיק ולהדביק בגיליון חדש.",true);
  }finally{b.disabled=false}
}
async function downloadCSV(){
  try{const dl=await window.claude?.use?.("downloads");if(!dl)throw 0;
    await dl.save({filename:"chokopop-summary.csv",data:"﻿"+toCSV(rows())});msg("הקובץ נשמר.")}
  catch(e){msg("ההורדה לא זמינה כאן. אפשר להשתמש ב׳העתקה להדבקה בגיליון׳.",true)}
}
async function copyTSV(){
  const t=toTSV(rows());
  try{await navigator.clipboard.writeText(t);msg("הועתק. פתחו גיליון חדש ב-Google Sheets והדביקו בתא A1.")}
  catch(e){msg(`ההעתקה האוטומטית לא עבדה. סמנו והעתיקו מכאן:<textarea id="tsvBox" readonly></textarea>`,true);const ta=$("tsvBox");ta.value=t;ta.focus();ta.select()}
}

// controls
$("backBtn").onclick=back;
$("yesBtn").onclick=()=>{const c=cur();if(c.step==="card")fly(ITEMS[c.i],"buy")};
$("noBtn").onclick=()=>{const c=cur();if(c.step==="card")fly(ITEMS[c.i],"skip")};
document.addEventListener("keydown",e=>{
  if(e.target.tagName==="INPUT")return;
  const c=cur();
  if(c.step==="card"&&e.key==="ArrowRight")fly(ITEMS[c.i],"buy");
  else if(c.step==="card"&&e.key==="ArrowLeft")fly(ITEMS[c.i],"skip");
  else if(e.key==="Backspace"){e.preventDefault();back()}
});
render();

// shared progress (so the sorting can continue on another device, and Claude can read the result)
(async()=>{
  try{
    db=await window.claude?.use?.("db");if(!db)return;
    const r=await db.doc("sorting/main").get();
    const d=r&&(typeof r.data==="function"?r.data():(r.data!==undefined?r.data:r));
    if(d&&d.answers&&d.hist&&d.hist.length&&(d.updatedAt||0)>(S.updatedAt||0)&&Object.keys(d.answers).length>=Object.keys(S.answers).length){
      S={answers:d.answers,hist:d.hist};try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}render();
    }
  }catch(e){}
})();
</script>

</body></html>
